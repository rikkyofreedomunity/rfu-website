    <p>
      R.F.U.（Rikkyo Freedom Unity）は、立教大学を拠点に活動するバンドサークルです。

ロックを中心に、UKロック、USインディー、ガレージ、グランジ、オルタナティブ、サイケデリック、ハードコアパンク、シューゲイザー、邦楽ロックなど、ジャンルにとらわれずさまざまな音楽を演奏しています。

決まった音楽性に縛られるのではなく、それぞれが好きな音楽を持ち寄り、バンドという形で音を鳴らすこと。R.F.U.は、そんな自由な音楽活動を続けてきたサークルです。
