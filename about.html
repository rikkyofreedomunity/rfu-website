    <p>
      R.F.U.（正式名称/Rikkyo Freedom Unity）は、東京の池袋に本拠を置く私立大学、立教大学の音楽団体連合に所属する大学公認のバンドサークル。R.F.U.が創設されたのは、1971年。創設から50年以上の歴史あるサークル。演奏するジャンルはUKロック・USインディー・ガレージ・グランジ・オルタナ・サイケデリック・ハードコアパンク・シューゲイザー・邦楽ロックなど多岐にわたる。
