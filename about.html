    <p>
  R.F.U.（正式名称 / Rikkyo Freedom Unity）は、
  東京・池袋に本拠を置く私立大学、立教大学の音楽団体連合に所属する
  大学公認のバンドサークルです。
</p>

<p>
  R.F.U.が創設されたのは、1971年。
  創設から50年以上の歴史を持つサークルです。
</p>

<p>
  演奏するジャンルは、UKロック・USインディー・ガレージ・グランジ・
  オルタナ・サイケデリック・ハードコアパンク・シューゲイザー・
  邦楽ロックなど多岐にわたります。
</p>
