<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTOS | RIKKYO FREEDOM UNITY</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .photo-archive {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 5% 100px;
      color: #f4f4f0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .photo-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 28px;
    }

    .photo-eyebrow {
      font-size: 11px;
      letter-spacing: 0.16em;
      margin-bottom: 14px;
      color: #aaa;
    }

    .photo-heading h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .photo-date {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: #aaa;
    }

    .photo-intro {
      max-width: 250px;
      font-size: 12px;
      line-height: 1.9;
      color: #aaa;
    }

    .photo-rule {
      border: 0;
      border-top: 1px solid #444;
      margin: 28px 0;
    }

    .photo-main,
    .photo-item {
      margin: 0;
      min-width: 0;
    }

    .photo-main img,
    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #222;
    }

    .photo-main img {
      aspect-ratio: 16 / 9;
    }

    .photo-main figcaption,
.photo-item figcaption {
  display: none;
}

    .photo-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 0;
  margin-top: 0;
}

    .photo-item img {
      aspect-ratio: 4 / 3;
    }

    .photo-item.portrait img {
      aspect-ratio: 3 / 4;
    }

    .photo-item.wide {
      grid-column: span 4;
    }

    .photo-item.medium {
      grid-column: span 3;
    }

    .photo-item.small {
      grid-column: span 2;
    }

    .photo-item.portrait {
      grid-column: span 2;
    }

    @media (max-width: 600px) {
      .photo-archive {
        padding: 45px 5% 70px;
      }

      .photo-heading {
        display: block;
      }

      .photo-intro {
        margin-top: 22px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 12px;
      }

      .photo-item.wide,
      .photo-item.medium {
        grid-column: span 2;
      }

      .photo-item.small,
      .photo-item.portrait {
        grid-column: span 1;
      }

      .photo-item.wide img {
        aspect-ratio: 4 / 3;
      }

      .photo-item.portrait img {
        aspect-ratio: 3 / 4;
      }
    }
  </style>
</head>

<body>
  <a class="top-button" href="index.html">TOP ↑</a>

  <header class="site-header">
    <div class="rfu-mark">R.F.U.</div>
  </header>

  <main class="photo-archive">
    <div class="photo-heading">
      <div>
        <div class="photo-eyebrow">R.F.U. / PHOTO ARCHIVE</div>
        <h1>LIVE PHOTO</h1>
        <div class="photo-date">2026.10.09</div>
      </div>
      <p class="photo-intro">
        秋コン　2026.10.10

    <hr class="photo-rule">

    <figure class="photo-main">

      <figcaption>01 / LIVE PERFORMANCE</figcaption>
    </figure>

    <div class="photo-grid">
      <figure class="photo-item portrait">

      <figure class="photo-item portrait">

        <figcaption>04 / DRUMS</figcaption>
      </figure>

      <figure class="photo-item wide">
        <img src="LINE_ALBUM_秋コン_261010_3.jpg" alt="ライブ写真 05">

      <figure class="photo-item small">

      <figure class="photo-item small">

      <figure class="photo-item small">

      <figure class="photo-item wide">

      </figure>

      <figure class="photo-item medium">
        <img src="LINE_ALBUM_秋コン_261010_12.jpg" alt="ライブ写真 11">
        <figcaption>11 / AFTER LIVE</figcaption>
      </figure>

      <figure class="photo-item small">
        <img src="LINE_ALBUM_秋コン_261010_13.jpg" alt="ライブ写真 12">
        <figcaption>12 / LIVE MOMENT</figcaption>
      </figure>

      <figure class="photo-item small">

      </figure>

    </div>
  </main>
</body>
</html>
