
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE PHOTO | RIKKYO FREEDOM UNITY</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .photo-archive {
      max-width: 1100px;
      margin: auto;
      padding: 50px 24px 80px;
      color: #f4f4f0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .photo-heading {
      margin-bottom: 40px;
    }

    .photo-eyebrow {
      color: #aaa;
      font-size: 11px;
      letter-spacing: .16em;
      margin-bottom: 14px;
    }

    .photo-heading h1 {
      font-size: clamp(40px, 7vw, 76px);
      font-weight: 500;
      margin: 0;
    }

    .photo-intro {
      color: #aaa;
      font-size: 12px;
      line-height: 1.9;
      margin-top: 20px;
    }

    .live-list {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .live-item {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 24px;
      align-items: center;
      color: #f4f4f0;
      text-decoration: none;
    }

    .live-item img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .live-info {
      padding: 20px 0;
    }

    .live-date {
      color: #aaa;
      font-size: 11px;
      letter-spacing: .15em;
    }

    .live-title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      margin: 12px 0;
    }

    .live-link {
      color: #aaa;
      font-size: 10px;
      letter-spacing: .15em;
      margin-top: 20px;
    }

    .live-item:hover .live-link {
      color: white;
    }

    @media (max-width: 600px) {
      .photo-archive {
        padding: 36px 14px 55px;
      }

      .live-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .live-info {
        padding: 8px 0;
      }
    }
  </style>
</head>

<body>

  <a class="top-button" href="index.html">TOP ↑</a>

  <header class="site-header">
    <div class="rfu-mark">R.F.U.</div>
  </header>

  <main class="photo-archive">

    <div class="photo-heading">
      <div class="photo-eyebrow">R.F.U. / PHOTO ARCHIVE</div>
      <h1>LIVE PHOTO</h1>
      <p class="photo-intro">
        Moments from our live performances.
      </p>
    </div>

    <div class="live-list">

      <a href="autumn.html" class="live-item">
        <img src="LINE_ALBUM_秋コン_261010_7.jpg"
             alt="秋コン">

        <div class="live-info">
          <div class="live-date">2026.10.09</div>
          <div class="live-title">AUTUMN CONCERT</div>
          <div class="live-link">VIEW PHOTOS →</div>
        </div>
      </a>

      <a href="teien.html" class="live-item">
        <img src="定演の写真ファイル名.jpg"
             alt="定演">

        <div class="live-info">
          <div class="live-date">定演の日付</div>
          <div class="live-title">REGULAR CONCERT</div>
          <div class="live-link">VIEW PHOTOS →</div>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
