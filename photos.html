<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTOS | RIKKYO FREEDOM UNITY</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .photo-archive {
      max-width: 1100px;
      margin: auto;
      padding: 50px 24px 80px;
      color: #f4f4f0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .photo-heading { margin-bottom: 32px; }
    .photo-eyebrow {
      color: #aaa;
      font-size: 11px;
      letter-spacing: .16em;
      margin-bottom: 14px;
    }
    .photo-heading h1 {
      font-size: clamp(40px, 7vw, 76px);
      font-weight: 500;
      margin: 0;
    }
    .photo-date {
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: .15em;
      color: #aaa;
    }
    .photo-intro {
      color: #aaa;
      font-size: 12px;
      line-height: 1.9;
      margin-top: 20px;
    }
    .photo-list {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .photo-item { margin: 0; width: 100%; }
    .photo-item img {
      display: block;
      width: 100%;
      height: auto;
    }
    .photo-item figcaption {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      color: #aaa;
      font-size: 10px;
      letter-spacing: .1em;
    }
    @media (max-width: 600px) {
      .photo-archive { padding: 36px 14px 55px; }
      .photo-list { gap: 26px; }
    }
  </style>
</head>
