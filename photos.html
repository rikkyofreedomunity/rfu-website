<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTOS | RIKKYO FREEDOM UNITY</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .photo-archive {
      max-width: 1100px;
      margin: auto;
      padding: 50px 24px 80px;
      color: #f4f4f0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .photo-heading { margin-bottom: 32px; }
    .photo-eyebrow {
      color: #aaa;
      font-size: 11px;
      letter-spacing: .16em;
      margin-bottom: 14px;
    }
    .photo-heading h1 {
      font-size: clamp(40px, 7vw, 76px);
      font-weight: 500;
      margin: 0;
    }
    .photo-date {
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: .15em;
      color: #aaa;
    }
    .photo-intro {
      color: #aaa;
      font-size: 12px;
      line-height: 1.9;
      margin-top: 20px;
    }
    .photo-list {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .photo-item { margin: 0; width: 100%; }
    .photo-item img {
      display: block;
      width: 100%;
      height: auto;
    }
    .photo-item figcaption {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      color: #aaa;
      font-size: 10px;
      letter-spacing: .1em;
    }
    @media (max-width: 600px) {
      .photo-archive { padding: 36px 14px 55px; }
      .photo-list { gap: 26px; }
    }
    /* UNIFORM PHOTO GRID */
.photo-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}

.photo-item {
  width: 100%;
  margin: 0;
  min-width: 0;
  overflow: hidden;
}

.photo-item img {
  display: block;
  width: 100%;
  height: 260px;
  object-fit: cover;
  object-position: center;
}

.photo-item figcaption {
  display: none;
}

@media (max-width: 600px) {
  .photo-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px;
  }

  .photo-item img {
    height: 180px;
  }
}
    /* PHOTO LAYOUT */
.photo-list {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}

.photo-item {
  grid-column: span 2;
  width: 100%;
  margin: 0;
  min-width: 0;
  overflow: hidden;
}

.photo-item img {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: cover;
  object-position: center;
}

/* 1 LARGE HERO PHOTO */
.photo-item:nth-child(1) {
  grid-column: 1 / -1;
}

.photo-item:nth-child(1) img {
  height: auto;
  max-height: 620px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

/* 2 MEDIUM PHOTOS */
.photo-item:nth-child(2),
.photo-item:nth-child(3) {
  grid-column: span 3;
}

.photo-item:nth-child(2) img,
.photo-item:nth-child(3) img {
  height: 320px;
}

/* REMAINING SMALL GRID */
.photo-item:nth-child(n+4) {
  grid-column: span 2;
}

.photo-item figcaption {
  display: none;
}

/* MOBILE */
@media (max-width: 600px) {
  .photo-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px;
  }

  .photo-item:nth-child(1) {
    grid-column: 1 / -1;
  }

  .photo-item:nth-child(1) img {
    height: auto;
    aspect-ratio: 4 / 3;
  }

  .photo-item:nth-child(2),
  .photo-item:nth-child(3) {
    grid-column: span 1;
  }

  .photo-item:nth-child(2) img,
  .photo-item:nth-child(3) img {
    height: 200px;
  }

  .photo-item:nth-child(n+4) {
    grid-column: span 1;
  }

  .photo-item:nth-child(n+4) img {
    height: 160px;
  }
}
  </style>
</head>
